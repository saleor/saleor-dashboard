<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex" />

    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
    <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" />
    <title>Sign in to the Saleor Dashboard</title>

    <meta
      name="description"
      content="Sign in to the Saleor Dashboard to manage your orders, payments, products and more."
    />

    <script>
      window.__SALEOR_CONFIG__ = {
        API_URL: "<%= API_URL %>",
        APP_MOUNT_URI: "<%= APP_MOUNT_URI %>",
        STATIC_URL: "<%= STATIC_URL %>",
        EXTENSIONS_API_URL: "<%= EXTENSIONS_API_URL %>",
        IS_CLOUD_INSTANCE: "<%= IS_CLOUD_INSTANCE %>",
        SALEOR_CLOUD_APP_DOMAIN: "<%= SALEOR_CLOUD_APP_DOMAIN %>",
        LOCALE_CODE: "<%= LOCALE_CODE %>",
      };
    </script>
  </head>

  <body>
    <div id="dashboard-app"></div>
    <div id="portal"></div>
    <div id="modal-root"></div>
    <div id="toast-portal"></div>
  </body>
</html>
