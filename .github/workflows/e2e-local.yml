# The local-stack E2E suite: a disposable Saleor in docker, the dashboard built from this
# branch, no Saleor Cloud involved.
#
# Dispatch-only for now. The suite is young, and a full run is dominated by a `vite build`
# per target; putting it on every pull request before it has earned the time would mostly
# buy queue. Moving it onto pull requests is a one-line change to the `on:` block.
name: E2E (local stack)

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: "Which Saleor to test against"
        required: false
        default: "both"
        options:
          - both
          - stable
          - main
      grep:
        type: string
        description: "Playwright --grep filter (optional)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      # The targets are independent; a break in one is worth seeing alongside the other.
      fail-fast: false
      # Anything other than a single named target - "both", or a dispatch that sent no input
      # at all - means run them both.
      matrix:
        target: ${{ fromJSON((inputs.target == 'stable' || inputs.target == 'main') &&
          format('["{0}"]', inputs.target) || '["stable","main"]') }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        env:
          E2E_TARGET: ${{ matrix.target }}
          GREP: ${{ inputs.grep }}
        run: |
          # `pnpm run generate` runs both schemas; the staging tree is what the `main`
          # target's bundle is built from, so it cannot be skipped for either target.
          pnpm run generate
          args=()
          if [[ -n "$GREP" ]]; then
            args+=( --grep "$GREP" )
          fi
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON e2e/run.ts \
            --target="$E2E_TARGET" "${args[@]}"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.target }}-report--attempt-${{ github.run_attempt }}
          path: |
            e2e/test-results
            playwright-report
          retention-days: 7

      - name: Tear the stack down
        if: always()
        env:
          E2E_TARGET: ${{ matrix.target }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON e2e/run.ts --down --target="$E2E_TARGET"
