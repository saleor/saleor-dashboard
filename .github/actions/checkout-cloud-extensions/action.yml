name: Check out Saleor Cloud extensions
description: >
  Checks out the private Saleor Cloud features at the cloud-console commit pinned in
  .github/cloud-extensions.ref and copies them over src/cloud.
inputs:
  client-id:
    description: Client ID of the GitHub App installed on saleor/cloud-console
    required: true
  private-key:
    description: Private key of that GitHub App
    required: true
runs:
  using: composite
  steps:
    - name: Read pinned commit
      id: ref
      shell: bash
      run: echo "sha=$(< .github/cloud-extensions.ref)" >> "$GITHUB_OUTPUT"

    - name: Get cloud-console read token
      id: token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: saleor
        repositories: cloud-console
        permission-contents: read

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: saleor/cloud-console
        ref: ${{ steps.ref.outputs.sha }}
        token: ${{ steps.token.outputs.token }}
        path: .cloud-extensions
        sparse-checkout: dashboard-extensions
        persist-credentials: false

    - name: Copy the extensions into src/cloud
      shell: bash
      run: |
        rm -rf src/cloud
        cp -R .cloud-extensions/dashboard-extensions src/cloud
