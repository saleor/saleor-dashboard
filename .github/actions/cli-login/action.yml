name: Saleor CLI login
description: Install the pinned Saleor CLI and log in to staging Saleor Cloud
inputs:
  token:
    description: "Cloud access token"
    required: true
runs:
  using: "composite"
  steps:
    # Version is pinned in .github/scripts/package.json - never resolve "latest" at runtime.
    - name: Install Saleor CLI
      shell: bash
      working-directory: .github/scripts
      run: |
        pnpm install --frozen-lockfile
        echo "$GITHUB_WORKSPACE/.github/scripts/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Write config file
      shell: bash
      id: write-config-file
      env:
        ACCESS_TOKEN: ${{ inputs.token }}
      run: |
        jq --null-input \
           --arg token "Token $ACCESS_TOKEN" \
           '{"token":$token,"telemetry":"false","saleor_env":"staging","cloud_api_url":"https://cloud.staging.saleor.io/platform/api","organization_slug":"saleor","organization_name":"Saleor"}' > ~/.config/saleor.json
